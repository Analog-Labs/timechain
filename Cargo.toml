[workspace.package]
authors = [ "Analog Devs <https://github.com/Analog-Labs>" ]
edition = "2021"
version = "0.8.0"
homepage = "https://analog.one/"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Analog-Labs/timechain"

[workspace]
resolver = "2"
members = [
	"chronicle",
	"docs",
	"e2e-tests",
	"gmp",
	"gmp/evm",
	"gmp/grpc",
	"gmp/rust",
	"node",
	"pallets/airdrop",
	"pallets/dmail",
	"pallets/elections",
	"pallets/governance",
	"pallets/launch",
	"pallets/members",
	"pallets/networks",
	"pallets/shards",
	"pallets/tasks",
	"pallets/timegraph",
	"primitives",
	"runtime",
	"slack-bot",
	"tc-cli",
	"tc-subxt",
	"tc-subxt/metadata",
	"tss",
	"utils/generate-bags",
]
default-members = [
  "chronicle",
  "node",
  "tc-cli",
]

[workspace.dependencies]
# common shared synced libs
anyhow = { version =  "1.0.97", default-features = false }
async-channel = "2.3.1"
async-stream = "0.3.6"
async-trait = "0.1.88"
clap = { version = "4.5.32", features = [ "derive" ] }
env_logger = "0.11.7"
futures = "0.3.31"
hex = "0.4.3"
hex-literal = "1.0.0"
log = { version = "0.4.27", default-features = false }
reqwest = { version = "^0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.219", default-features = false, features = [ "derive" ] }
serde_json = { version = "^1.0", default-features = false }
simple-mermaid = "0.2.0"
tokio = "1.44.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

# substrate support libs
scale-codec = { package = "parity-scale-codec", version = "3.7.4", default-features = false, features = [ "derive" ] }
scale-decode = { version = "0.16.0", default-features = false, features = [ "derive" ] }
scale-info = { version = "2.11.6", default-features = false, features = [ "derive" ] }

# main substrate sdk
polkadot-sdk = { git = "https://github.com/Analog-Labs/polkadot-sdk", branch = "rebased-stable2503-analog0", default-features = false }

# specialized wasm builder
substrate-wasm-builder = { git = "https://github.com/Analog-Labs/polkadot-sdk", branch = "rebased-stable2503-analog0", features = [ "metadata-hash" ] }

# metadata based chain interaction
subxt = { git = "https://github.com/Analog-Labs/subxt", tag = "v0.41.0-anlog0" }
subxt-signer = { git = "https://github.com/Analog-Labs/subxt", tag = "v0.41.0-anlog0" }

# shared code between node and runtime (nostd by default)
time-primitives = { path = "primitives", default-features = false }

# pallets in workspace (nostd by default)
pallet-airdrop = { path = "pallets/airdrop", default-features = false }
pallet-dmail = { path = "pallets/dmail", default-features = false }
pallet-elections = { path = "pallets/elections", default-features = false }
pallet-governance = { path = "pallets/governance", default-features = false }
pallet-launch = { path = "pallets/launch", default-features = false }
pallet-members = { path = "pallets/members", default-features = false }
pallet-networks = { path = "pallets/networks", default-features = false }
pallet-shards = { path = "pallets/shards", default-features = false }
pallet-tasks = { path = "pallets/tasks", default-features = false }
pallet-timegraph = { path = "pallets/timegraph", default-features = false }

# runtimes in workspace
timechain-runtime = { path = "runtime" }

# shared libs in workspace
gmp = { path = "gmp" }
tc-subxt = { path = "tc-subxt" }
tss = { path = "tss" }

[profile.release]
# Runtime requires unwinding.
panic = "unwind"
opt-level = 3

# Use highly optimized build on mainnet
[profile.mainnet]
inherits = "release"
lto = true
codegen-units = 1

# Enable debug features on testnet
[profile.testnet]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true

# The list of dependencies below (which can be both direct and indirect dependencies) are crates
# that are suspected to be CPU-intensive, and that are unlikely to require debugging (as some of
# their debug info might be missing) or to require to be frequently recompiled. We compile these
# dependencies with `opt-level=3` even in "dev" mode in order to make "dev" mode more usable.
# The majority of these crates are cryptographic libraries.
#
# If you see an error mentioning "profile package spec ... did not match any packages", it
# probably concerns this list.
#
# This list is ordered alphabetically.
[profile.dev.package]
ed25519-dalek = { opt-level = 3 }
libsecp256k1 = { opt-level = 3 }
num-bigint = { opt-level = 3 }
parking_lot = { opt-level = 3 }
primitive-types = { opt-level = 3 }
rustls = { opt-level = 3 }
sha3 = { opt-level = 3 }
smallvec = { opt-level = 3 }
uint = { opt-level = 3 }

[patch.crates-io]
# Testnet assginment was not accepted upstream
ss58-registry = { git = 'https://github.com/Analog-Labs/ss58-registry.git', tag='v1.51.0-anlog0' }
