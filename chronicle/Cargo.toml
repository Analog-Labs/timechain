[package]
name = "chronicle"
description = "Node operating the Analog GMP protocol"

version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
futures.workspace = true
gmp.workspace = true
hex.workspace = true 
serde.workspace = true
serde_json.workspace = true
time-primitives = { workspace = true, default-features = true }
tc-subxt.workspace = true
tokio.workspace = true
tracing.workspace = true
tss.workspace = true
polkadot-sdk = { workspace = true, features = [
    "sp-runtime",
]}
scale-codec.workspace = true
bincode = "1.3.3"
bip39 = "2.1.0"
getrandom = "0.3.2"
peernet = "0.4.2"
prometheus_exporter = { version = "0.8.5", default-features = false, features = ["logging"] }
schnorr-evm = { version = "0.1.2" }
sha3 = { version = "0.10" }
tide = { version = "0.16.0", default-features = false, features = ["h1-server"] }
tracing-panic = "0.1.2"
tracing-opentelemetry = "0.30.0"
tracing-core = "0.1.33"
opentelemetry = { version = "0.29.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.29.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.29.0", features = ["metrics", "grpc-tonic"] }
json-subscriber = { version = "0.2.4", features = ["env-filter"] }
tracing-subscriber.workspace = true

[dev-dependencies]
ed25519-dalek = "2.1.1"
tempfile = "3.19.1"

[features]
testnet = [ "time-primitives/testnet", "tc-subxt/testnet" ]
develop = [ "time-primitives/develop", "tc-subxt/develop" ]
