name: Run end-to-end tests
on:
  pull_request:
    types: [labeled, unlabeled, opened, reopened, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-tests:
    runs-on: [self-hosted, integration]
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install latest cargo-nextest release
        uses: taiki-e/install-action@nextest

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust cache
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build testsuite
        uses: ./.github/actions/cargo-command
        with:
          command: test
          package: e2e-tests
          args: --no-run
          # Handling cache in the Actions Cache
          cache: false

      - name: Run testsuite with cargo-nextest
        uses: actions-rs/cargo@v1
        with:
          command: nextest
          args: run -p e2e-tests --config-file nextest.toml --no-capture

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/*.tar.zst
          sudo rm -rf /tmp/.tmp*
          docker ps -q --filter name=tmp | xargs docker stop || true
          docker container ls -a -q --filter name=tmp | xargs docker rm || true
          docker network ls -q --filter name=tmp | xargs docker network rm || true
