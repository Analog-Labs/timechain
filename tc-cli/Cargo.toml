[package]
name = "tc-cli"
authors.workspace = true
edition.workspace = true
version.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
alloy.workspace = true
anyhow.workspace = true
clap.workspace = true
csv = "1.3.1"
csv_to_table = "0.7.0"
dotenv = "0.15.0"
futures.workspace = true
gmp.workspace = true
hex.workspace = true
log.workspace = true
num-bigint = "0.4.6"
num-rational = "0.4.2"
num-traits = "0.2.19"
polkadot-sdk = { workspace = true, features = ["sp-runtime"]}
reqwest.workspace = true
rustls = { version = "0.23", features = ["ring"], default-features = false }
scale-codec.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9.34"
slack-morphism = { version = "2.10.1", features = ["hyper"] }
tabled = "0.18.0"
tc-subxt.workspace = true
time-primitives = { workspace = true, default-features = true }
tokio = { workspace = true, features = [ "macros", "rt-multi-thread", "signal" ]}
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
testnet = [
  "time-primitives/testnet",
  "tc-subxt/testnet",
]
develop = [
  "time-primitives/develop",
  "tc-subxt/develop",
]
